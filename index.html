<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="assets/icon.png">
</head>
<body>
    <div class="left-container">
        <img src="assets/icon.png" alt="icon" class="icon">
        <img src="assets/burger.png" alt="burger" class="burger">
        <p class="tagline">Dive <br> into <br> the <br>  <span>Burger World</span></p>
    </div>
    <div class="right-container">
        <div class="head">
            <img src="https://buffalonlineorderingapp.s3-accelerate.amazonaws.com/static_images/headerLogo.svg" alt="icon" class="logo">
        </div>
        <div class="form">
            <form>
                <input type="text" placeholder="Username" required>
                <input type="password" placeholder="Password" required>
                <button type="submit">Log in</button>
                <button type="button" class="Register">Sign up</button>
            </form>
        </div>
    </div>
</body>
</html>
